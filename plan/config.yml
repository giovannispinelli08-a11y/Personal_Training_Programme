# ============================================================
# CONFIG DEL PIANO — lo strato di giudizio.
# Questo file lo si aggiorna a mano a fine di ogni blocco.
# Tutto il resto (date, sedute, zone, progressioni) lo calcola
# build_plan.py a partire da qui.
# ============================================================

atleta:
  fc_max: 195
  # Sensore cardio: ottico da polso (fascia rotta).
  # Affidabile sul continuo, inaffidabile sulle variazioni rapide:
  # per questo le sedute intervallate NON hanno target FC.
  sensore_fc: ottico_polso
  # Ritmo facile indicativo, usato SOLO per convertire i minuti in km
  # stimati nella tabella. Non è un target: il target è la FC.
  # Da aggiornare quando i dati lo spostano.
  ritmo_facile_indicativo: "6:50"

gara_obiettivo:
  nome: "Zurich Marathon — Halbmarathon"
  data: 2027-04-11
  distanza_km: 21.1

gare_intermedie:
  - nome: "Test 5 km"
    data: 2026-12-06
    distanza_km: 5
    modalita: test    # sforzo costante e massimale per calibrare i ritmi

# ------------------------------------------------------------
# Zone di frequenza cardiaca, come % della FC max.
# ------------------------------------------------------------
zone_fc:
  Z1: [0.60, 0.70]   # recupero
  Z2: [0.70, 0.80]   # aerobica — il grosso del volume
  Z3: [0.80, 0.87]   # soglia bassa / tempo
  Z4: [0.87, 0.92]   # soglia alta
  Z5: [0.92, 1.00]   # VO2max

# ------------------------------------------------------------
# Tipi di seduta. hr_zone = null significa "niente target FC",
# si va a durata e sforzo percepito (vedi nota sensore ottico).
# ------------------------------------------------------------
tipi_seduta:
  facile:        { hr_zone: Z2, quota_volume: 1.0, disciplina: corsa }
  facile_allunghi: { hr_zone: Z2, quota_volume: 1.0, disciplina: corsa, extra: "5x100m in scioltezza a fine seduta, recupero camminando" }
  lungo:         { hr_zone: Z2, quota_volume: 1.0, disciplina: corsa, nota: "tenere la FC nella metà bassa della zona" }
  tempo:         { hr_zone: Z3, quota_volume: 1.45, disciplina: corsa, nota: "blocco continuo in Z3 dentro una seduta con riscaldamento e defaticamento" }
  ripetute:      { hr_zone: null, quota_volume: 1.45, disciplina: corsa, nota: "sforzo percepito 8/10, recupero completo; niente target FC col sensore ottico" }
  ritmo_gara:    { hr_zone: null, quota_volume: 1.0, disciplina: corsa, nota: "ultimi km del lungo al ritmo gara previsto" }
  riposo:        { hr_zone: null, quota_volume: 0.0, disciplina: corsa }
  # Sedute di supporto: durata fissa, fuori dal volume di corsa settimanale.
  mobilita:      { hr_zone: null, minuti_fissi: 15, disciplina: supporto,
                   nota: "mobilità caviglia e allungamento fascia plantare" }
  potenziamento: { hr_zone: null, minuti_fissi: 20, disciplina: supporto,
                   nota: "calf raise: due gambe, poi gamba singola, poi con carico" }

# ------------------------------------------------------------
# BLOCCHI. minuti_settimana e lungo_minuti sono i due numeri che
# guidano tutto: il primo è il volume settimanale totale, il secondo
# la durata del lungo. Entrambi progrediscono linearmente dentro
# il blocco, da [inizio] a [fine].
# ------------------------------------------------------------
blocchi:

  - id: rientro
    nome: "Rientro dopo infortunio"
    dal: 2026-09-28
    al: 2026-10-25
    minuti_settimana: [95, 115]
    lungo_minuti: [33, 45]
    schema: [lungo, facile, facile, mobilita, potenziamento, mobilita]
    note: >
      Tre corse brevi ed equivalenti: in questa fase la frequenza di esposizione
      conta più della durata della singola seduta. Ritmo molto lento, camminare
      quando serve. Se compare fastidio si rallenta, non ci si ferma.

  - id: base-1
    nome: "Base — ricostruzione"
    dal: 2026-10-26
    al: 2026-12-06
    minuti_settimana: [120, 165]
    lungo_minuti: [50, 75]
    schema: [lungo, facile, facile, facile_allunghi, potenziamento, mobilita]
    note: >
      Rientra un lungo vero e crescono le sedute facili. Il blocco chiude
      con il test da 5 km per calibrare i ritmi.

  - id: base-2
    nome: "Base — volume"
    dal: 2026-12-07
    al: 2027-01-17
    minuti_settimana: [170, 215]
    lungo_minuti: [80, 100]
    schema: [lungo, facile, tempo, facile, potenziamento]
    note: >
      Entra la soglia. Il lungo supera l'ora e un quarto.

  - id: build
    nome: "Build — qualità"
    dal: 2027-01-18
    al: 2027-02-28
    minuti_settimana: [220, 270]
    lungo_minuti: [100, 125]
    schema: [lungo, facile, tempo, ripetute, facile, potenziamento]
    note: >
      Ripetute e soglia nella stessa settimana, separate da almeno 48 ore.

  - id: specifico
    nome: "Specifico — ritmo gara"
    dal: 2027-03-01
    al: 2027-03-28
    minuti_settimana: [275, 310]
    lungo_minuti: [130, 150]
    schema: [ritmo_gara, facile, tempo, ripetute, facile]
    note: >
      Il lungo diventa specifico: ultima parte al ritmo gara.

  - id: taper
    nome: "Taper e gara"
    dal: 2027-03-29
    al: 2027-04-11
    minuti_settimana: [170, 95]
    lungo_minuti: [75, 0]
    schema: [facile_allunghi, facile, facile, riposo]
    note: >
      Volume giù, intensità appena accennata. Gara la domenica.

settimane_scarico: [4, 8, 12, 16, 20, 24]
fattore_scarico: 0.65

# Giorno preferito per tipo di seduta. Serve a tenere le sedute
# di qualità lontane dal lungo: ripetute a inizio settimana, soglia
# a metà, lungo la domenica con almeno un giorno facile in mezzo.
# Il confronto piano/reale è settimanale, quindi spostare una seduta
# di un giorno non conta come scostamento.
giorni_preferiti:
  lungo:      domenica
  ritmo_gara: domenica
  ripetute:   martedi
  tempo:      giovedi
# Le sedute facili riempiono i giorni rimasti, in quest'ordine.
giorni_riempimento: [martedi, giovedi, sabato, mercoledi, venerdi]
